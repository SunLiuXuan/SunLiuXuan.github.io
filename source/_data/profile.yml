intro: "Hi, I’m Liuxuan Sun, an undergraduate student majoring in Intelligent Science and Technology at Nanjing University. I will continue my studies at NJU as a master’s student under the supervision of Professor Wei Li. My research interests span computer vision, embodied AI, and autonomous driving. I am interested in exploring how intelligent systems perceive, understand, and interact with the physical world."
about: |
  Hi, I’m Liuxuan Sun, an undergraduate student majoring in Intelligent Science and Technology at Nanjing University. I will continue my studies at NJU as a master’s student under the supervision of Professor Wei Li.

  My research interests span computer vision, embodied AI, and autonomous driving. I am particularly interested in how AI agents understand visual environments, reason about interactions, and take meaningful actions in the physical world. Currently, I am exploring vision-language-action (VLA) models and world models, and investigating their application to end-to-end autonomous driving.

  I am always eager to explore new ideas and collaborate on research. Please feel free to reach out to discuss research or potential collaborations!
