intro: "Hi! I'm Liuxuan Sun, an undergraduate student at Nanjing University, majoring in Intelligent Science and Technology. My research interests lie broadly in computer vision, embodied AI, and multimodal agents, with a particular focus on video understanding, video generation, and vision-language-action models. I enjoy exploring how intelligent systems can perceive, reason about, and interact with the physical world."
about: |
  Hi, I'm Liuxuan Sun, an undergraduate student at Nanjing University, majoring in Intelligent Science and Technology.

  My research interests broadly lie in computer vision, embodied AI, and multimodal intelligent systems. I am particularly interested in how AI agents can understand visual environments, reason about interactions, and take meaningful actions in the physical world. Recently, I have been exploring topics including egocentric video understanding, video generation, vision-language-action models, and agent-based visual reasoning.

  Throughout my undergraduate studies, I have maintained strong academic performance and received several honors, including the People's Scholarship and the title of Outstanding Communist Youth League Member of Nanjing University. These experiences have also encouraged me to keep exploring both academic research and broader campus activities.

  I am always interested in learning new ideas and collaborating on exciting research. Feel free to reach out if you would like to discuss research or potential collaborations!
